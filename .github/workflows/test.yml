name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
        django: ["4.2", "5.2"]
        exclude:
          # Django 5.x requires Python >= 3.10
          - python: "3.9"
            django: "5.2"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[test]" "Django~=${{ matrix.django }}.0"
      - run: python manage.py test tests