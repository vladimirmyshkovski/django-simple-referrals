[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-simple-referrals"
version = "0.3"
description = "A simple application that allows you to generate referral links and track referrals"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Vladimir Myshkovski", email = "vladimirmyshkovski@gmail.com" }]
keywords = ["django", "referral", "referrals", "affiliate", "invite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["django-treebeard>=4.5"]

[project.optional-dependencies]
test = ["django-test-plus", "beautifulsoup4", "coverage"]

[project.urls]
Homepage = "https://github.com/vladimirmyshkovski/django-simple-referrals"
Documentation = "https://django-simple-referrals.readthedocs.io"
Source = "https://github.com/vladimirmyshkovski/django-simple-referrals"

[tool.setuptools.packages.find]
include = ["referrals*"]

[tool.setuptools]
include-package-data = true